name: Release Please

# Single entry point on push to main: run CI (which chains CodeQL), then
# release-please, then — only when a release is cut — build and publish the
# core skeleton archive. Same orchestration as startcloud_generic_provisioner /
# hyperweaver-ui.

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: write
  security-events: write
  packages: read

jobs:
  ci-checks:
    name: CI Checks
    uses: ./.github/workflows/ci.yml

  release-please:
    name: Release Please
    needs: ci-checks
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      major: ${{ steps.release.outputs.major }}
      minor: ${{ steps.release.outputs.minor }}
      patch: ${{ steps.release.outputs.patch }}
    steps:
      - name: Mint App token
        id: app
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_PRIVATE_KEY }}

      - name: Checkout code
        uses: actions/checkout@v7

      - name: Release Please
        uses: googleapis/release-please-action@v5
        id: release
        with:
          token: ${{ steps.app.outputs.token }}

  build-core:
    name: Build Core Artifact
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created }}
    uses: ./.github/workflows/build-core.yml
    with:
      version: ${{ needs.release-please.outputs.major }}.${{ needs.release-please.outputs.minor }}.${{ needs.release-please.outputs.patch }}
      tag_name: ${{ needs.release-please.outputs.tag_name }}

  # Announces the published release to every consumer provisioner: each runs a
  # dependency-bump workflow that rewrites its driver.version pin as a fix: PR
  # through its own CI gate. needs build-core so the assets exist before any
  # consumer reacts. Cross-repo dispatch cannot ride GITHUB_TOKEN — the App
  # token (BOT_APP_ID / BOT_PRIVATE_KEY org secrets) is required, and it mints
  # per OWNER, so consumers fan out as a matrix: each leg mints an org-scoped
  # token and dispatches to its one repo. The App must be installed on every
  # listed org (STARTcloud AND Moonshine-IDE). New consumers: add owner/repo
  # to the matrix, nothing else.
  notify-consumers:
    name: Notify consumers
    needs: [release-please, build-core]
    if: ${{ needs.release-please.outputs.release_created }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        consumer:
          - STARTcloud/startcloud_generic_provisioner
          - Moonshine-IDE/moonshinedev_provisioner_private
          - PhoneSwitchBoard/switchboard_provisioner_private
    steps:
      - name: Split owner and repo
        id: target
        env:
          CONSUMER: ${{ matrix.consumer }}
        run: |
          echo "owner=${CONSUMER%%/*}" >> "$GITHUB_OUTPUT"
          echo "repo=${CONSUMER##*/}" >> "$GITHUB_OUTPUT"

      - name: Mint App token
        id: app
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_PRIVATE_KEY }}
          owner: ${{ steps.target.outputs.owner }}
          repositories: ${{ steps.target.outputs.repo }}

      - name: Dispatch dependency-update
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
          CONSUMER: ${{ matrix.consumer }}
        run: |
          SHA="$(gh api "repos/${{ github.repository }}/commits/$TAG" --jq .sha)"
          gh api "repos/$CONSUMER/dispatches" \
            -f event_type=dependency-update \
            -f "client_payload[repo]=${{ github.repository }}" \
            -f "client_payload[tag]=$TAG" \
            -f "client_payload[sha]=$SHA"
          echo "Dispatched dependency-update: $CONSUMER <- $TAG"
